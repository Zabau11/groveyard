version: 1
runId: "mock-ts-app-routes-demo"
baseBranch: "main"

verify:
  - "../../../../node_modules/.bin/tsc -p examples/mock-ts-app/tsconfig.json"

protected:
  - ".agentx/**"
  - "examples/mock-ts-app/src/generated/**"
  - "examples/mock-ts-app/package.json"
  - "examples/mock-ts-app/tsconfig.json"
  - "package.json"
  - "package-lock.json"

generators:
  routes:
    output: "examples/mock-ts-app/src/generated/routes.ts"

agents:
  auth:
    adapter: "generic"
    command: "mkdir -p agent-output && printf '{\"version\":1,\"agent\":\"auth\",\"summary\":\"Declares mock auth login route.\",\"routes\":[{\"id\":\"auth.route.login\",\"path\":\"/login\",\"component\":\"LoginPage\",\"priority\":10}]}' > agent-output/manifest.json"
    task: "Declare the mock app auth login route."
    owns:
      - "examples/mock-ts-app/src/features/auth/**"
    forbidden:
      - "examples/mock-ts-app/src/generated/**"

  billing:
    adapter: "generic"
    command: "mkdir -p agent-output && printf '{\"version\":1,\"agent\":\"billing\",\"summary\":\"Declares mock billing invoices route.\",\"routes\":[{\"id\":\"billing.route.invoices\",\"path\":\"/billing/invoices\",\"component\":\"BillingInvoicesPage\",\"priority\":40}]}' > agent-output/manifest.json"
    task: "Declare the mock app billing invoices route."
    owns:
      - "examples/mock-ts-app/src/features/billing/**"
    forbidden:
      - "examples/mock-ts-app/src/generated/**"
