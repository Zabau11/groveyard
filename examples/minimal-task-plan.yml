version: 1
runId: "example-two-agents"
baseBranch: "main"

verify:
  - "npm run typecheck"

protected:
  - ".paraflow/**"
  - "src/generated/**"
  - "contracts/**"
  - "package.json"
  - "package-lock.json"

agents:
  auth:
    adapter: "generic"
    command: "mkdir -p agent-output && printf '{\"version\":1,\"agent\":\"auth\",\"summary\":\"Auth placeholder output.\"}\\n' > agent-output/manifest.json"
    task: "Implement password reset flow."
    owns:
      - "src/features/auth/**"
      - "tests/features/auth/**"
    mayRead:
      - "src/core/**"
      - "contracts/**"
    forbidden:
      - "src/features/billing/**"
      - "src/generated/**"

  billing:
    adapter: "generic"
    command: "mkdir -p agent-output && printf '{\"version\":1,\"agent\":\"billing\",\"summary\":\"Billing placeholder output.\"}\\n' > agent-output/manifest.json"
    task: "Add invoice download page."
    owns:
      - "src/features/billing/**"
      - "tests/features/billing/**"
    mayRead:
      - "src/core/**"
      - "contracts/**"
    forbidden:
      - "src/features/auth/**"
      - "src/generated/**"
