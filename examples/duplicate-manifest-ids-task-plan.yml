version: 1
runId: "example-duplicate-manifest-ids"
baseBranch: "main"

protected:
  - ".agentx/**"
  - "src/generated/**"
  - "package.json"
  - "package-lock.json"

agents:
  auth:
    adapter: "generic"
    command: "mkdir -p src/features/auth agent-output && printf 'export const authLogin = true;\\n' > src/features/auth/login.ts && printf '{\"version\":1,\"agent\":\"auth\",\"summary\":\"Adds auth login route.\",\"routes\":[{\"id\":\"shared.route.dashboard\",\"path\":\"/login\",\"component\":\"LoginPage\"}]}\\n' > agent-output/manifest.json"
    task: "Create an auth route declaration."
    owns:
      - "src/features/auth/**"

  dashboard:
    adapter: "generic"
    command: "mkdir -p src/features/dashboard agent-output && printf 'export const dashboard = true;\\n' > src/features/dashboard/dashboard.ts && printf '{\"version\":1,\"agent\":\"dashboard\",\"summary\":\"Adds dashboard route.\",\"routes\":[{\"id\":\"shared.route.dashboard\",\"path\":\"/dashboard\",\"component\":\"DashboardPage\"}]}\\n' > agent-output/manifest.json"
    task: "Create a dashboard route declaration."
    owns:
      - "src/features/dashboard/**"
