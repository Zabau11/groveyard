version: 1

# Commands run by agentx verify. Keep this empty until the project-specific
# checks are known.
verify: []

# Paths protected for every normal agent run.
protected:
  - ".agentx/**"
  - "contracts/**"
  - "src/generated/**"
  - "package.json"
  - "package-lock.json"
  - "pnpm-lock.yaml"
  - "yarn.lock"

adapters:
  generic:
    type: "shell"
