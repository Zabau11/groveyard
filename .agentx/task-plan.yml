version: 1
runId: commands-add-an-exported-helper-in-src-commands--20260702T220759
baseBranch: main
verify:
  - npm run typecheck
  - npm run build
protected:
  - .agentx/**
  - contracts/**
  - src/generated/**
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - yarn.lock
  - bun.lockb
  - src/generators/routes.ts
  - src/index.ts
  - tsconfig.json
generators: {}
agents:
  commands:
    adapter: auto
    task: >-
      commands add an exported helper in src/commands/status.ts that formats a
      run status summary line


      Focus only on src/commands. Emit agent-output/manifest.json when complete.
    owns:
      - src/commands/**
    mayRead:
      - README.md
      - IDEA.md
      - contracts/**
      - src/core/**
    forbidden:
      - .agentx/**
      - contracts/**
      - src/generated/**
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - yarn.lock
      - bun.lockb
      - src/generators/routes.ts
      - src/index.ts
      - tsconfig.json
    outputs: []
