  - npm run build
protected:
  - .paraflow/**
  - contracts/**
  - src/generated/**
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - yarn.lock
  - bun.lockb
  - src/generators/routes.ts
  - src/index.ts
  - tsconfig.json
generators: {}
agents:
