  schemas:
    adapter: auto
    task: |-
      create an paraflow diff feature

      Focus only on src/schemas. Emit agent-output/manifest.json when complete.
    owns:
      - src/schemas/**
    mayRead:
      - README.md
      - IDEA.md
      - contracts/**
      - src/core/**
