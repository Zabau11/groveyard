version: 1
mode: guard
goal: make output friendlier and add a bit of color, also simplfiy the check command
agent: guard-agent
task: >-
  make output friendlier and add a bit of color, also simplfiy the check command


  Work as one scoped coding agent. Keep the implementation inside the allowed
  paths and avoid opportunistic cleanup outside this task.


  If the task needs a protected file, do not edit it directly. Describe the need
  in agent-output/manifest.json.
edit:
  allow:
    - src/commands/**
  deny:
    - .paraflow/**
    - contracts/**
    - src/generated/**
    - package.json
    - package-lock.json
    - pnpm-lock.yaml
    - yarn.lock
    - bun.lockb
    - src/generators/routes.ts
    - src/index.ts
    - tsconfig.json
read:
  allow:
    - README.md
    - IDEA.md
    - src/index.ts
    - src/schemas/**
    - src/validation/**
output:
  required:
    - agent-output/manifest.json
checks:
  beforeFinish:
    - npm run typecheck
    - npm run build
