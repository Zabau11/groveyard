version: 1
mode: split
goal: update validation rules and command output
agent: commands
task: >-
  Lane-specific task: update command output


  Original request: update validation rules and command output


  Task profile: CLI command.

  Lane: src/commands.

  Focus: Implement command behavior, option parsing, user-facing output, and
  command wiring.


  Rules:

  - Edit only files owned by this lane unless the plan explicitly allows more.

  - Keep shared/protected files untouched.

  - Preserve existing public CLI behavior unless this task explicitly changes
  it.

  - Emit agent-output/manifest.json when complete.
edit:
  allow:
    - src/commands/**
  deny:
    - .paraflow/**
    - contracts/**
    - src/generated/**
    - package.json
    - package-lock.json
    - pnpm-lock.yaml
    - yarn.lock
    - bun.lockb
    - src/generators/routes.ts
    - src/index.ts
    - tsconfig.json
    - src/validation/**
read:
  allow:
    - README.md
    - IDEA.md
    - src/index.ts
    - src/schemas/**
    - src/validation/**
output:
  required:
    - agent-output/manifest.json
checks:
  beforeFinish:
    - npm run typecheck
    - npm run build
