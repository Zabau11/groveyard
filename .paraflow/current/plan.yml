    mayRead:
      - README.md
      - IDEA.md
      - src/commands/**
      - src/index.ts
      - src/schemas/**
    forbidden:
      - .paraflow/**
      - contracts/**
      - src/generated/**
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - yarn.lock
      - bun.lockb
      - src/generators/routes.ts
      - src/index.ts
      - tsconfig.json
      - src/commands/**
    outputs:
