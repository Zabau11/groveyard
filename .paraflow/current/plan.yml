version: 1
runId: make-output-friendlier-and-add-a-bit-of-color-al-20260706T161610
baseBranch: main
verify:
  - npm run typecheck
  - npm run build
protected:
  - .paraflow/**
  - contracts/**
  - src/generated/**
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - yarn.lock
  - bun.lockb
  - src/generators/routes.ts
  - src/index.ts
  - tsconfig.json
diff:
  patchOutput: agent-output/patch.diff
  summaryOutput: agent-output/diff.json
generators: {}
agents:
  guard-agent:
    adapter: manual
    task: >-
      make output friendlier and add a bit of color, also simplfiy the check
      command


      Work as one scoped coding agent. Keep the implementation inside the
      allowed paths and avoid opportunistic cleanup outside this task.


      If the task needs a protected file, do not edit it directly. Describe the
      need in agent-output/manifest.json.
    owns:
      - src/commands/**
    mayRead:
      - README.md
      - IDEA.md
      - src/index.ts
      - src/schemas/**
      - src/validation/**
    forbidden:
      - .paraflow/**
      - contracts/**
      - src/generated/**
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - yarn.lock
      - bun.lockb
      - src/generators/routes.ts
      - src/index.ts
      - tsconfig.json
    outputs:
      - agent-output/manifest.json
